name: Build ATSClient.exe

on:
  push:
    branches:
      - main
      - claude/ats-mod-files-Hkx9F
    paths:
      - ATSClient.py
      - worlds/**
      - hooks/**
      - .github/workflows/build-client.yml
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout ATS Apworld
        uses: actions/checkout@v4
        with:
          path: ats-apworld

      - name: Checkout Archipelago
        uses: actions/checkout@v4
        with:
          repository: ArchipelagoMW/Archipelago
          ref: main
          path: archipelago

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: archipelago
        run: pip install -r requirements.txt && pip install pyinstaller colorama "kivy[packaging]"

      - name: Install Mesa OpenGL software renderer
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri https://github.com/pal1000/mesa-dist-win/releases/download/23.3.3/mesa3d-23.3.3-release-msvc.7z -OutFile mesa.7z
          7z x mesa.7z -omesa -y
          .\mesa\systemwidedeploy.cmd 1

      - name: Copy ATS client files into Archipelago
        shell: pwsh
        run: |
          Copy-Item ats-apworld\ATSClient.py archipelago\ATSClient.py
          New-Item -ItemType Directory -Force -Path archipelago\worlds\american_truck_simulator | Out-Null
          Copy-Item -Recurse -Force ats-apworld\worlds\american_truck_simulator\* archipelago\worlds\american_truck_simulator\
          New-Item -ItemType Directory -Force -Path archipelago\hooks | Out-Null
          Copy-Item ats-apworld\hooks\rthook_ats_worlds.py archipelago\hooks\rthook_ats_worlds.py

      - name: Verify entry point (must not use run_as_textclient)
        shell: pwsh
        run: |
          $file = "ats-apworld\ATSClient.py"
          if (Select-String -Path $file -Pattern "run_as_textclient" -Quiet) {
            Write-Error "FAIL: ATSClient.py calls run_as_textclient — that hardcodes want_slot_data=False"
            exit 1
          }
          if (-not (Select-String -Path $file -Pattern "want_slot_data\s*=\s*True" -Quiet)) {
            Write-Error "FAIL: ATSContext.want_slot_data is not explicitly set to True"
            exit 1
          }
          if (-not (Select-String -Path $file -Pattern 'game\s*=\s*[''"]American Truck Simulator[''"]' -Quiet)) {
            Write-Error "FAIL: ATSContext.game is not set to 'American Truck Simulator'"
            exit 1
          }
          Write-Host "Entry point checks passed."

      - name: Build ATSClient.exe
        working-directory: archipelago
        shell: pwsh
        run: |
          $kivyDir = python -c "import kivy, os; print(os.path.dirname(kivy.__file__))"
          $kivymdDir = python -c "import kivymd, os; print(os.path.dirname(kivymd.__file__))"
          pyinstaller ATSClient.py `
            --name ATSClient `
            --onefile `
            --windowed `
            --runtime-hook hooks\rthook_ats_worlds.py `
            --hidden-import kvui `
            --hidden-import worlds.american_truck_simulator `
            --hidden-import worlds.american_truck_simulator.items `
            --hidden-import worlds.american_truck_simulator.locations `
            --hidden-import worlds.american_truck_simulator.regions `
            --hidden-import worlds.american_truck_simulator.rules `
            --hidden-import worlds.american_truck_simulator.options `
            "--add-data=worlds\__init__.py;worlds" `
            "--add-data=worlds\american_truck_simulator;worlds\american_truck_simulator" `
            "--add-data=$kivyDir\data;data" `
            "--add-data=$kivymdDir;kivymd" `
            "--add-data=data;data"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ATSClient-Windows
          path: archipelago\dist\ATSClient.exe
          if-no-files-found: error
