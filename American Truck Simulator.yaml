# Q. What is this file?
# A. This file contains options which allow you to configure your multiworld experience while allowing
#    others to play how they want as well.
#
# Q. How do I use it?
# A. The options in this file are weighted. This means the higher number you assign to a value, the
#    more chances you have for that option to be chosen. For example, an option like this:
#
#    map_shuffle:
#      on: 5
#      off: 15
#
#    Means you have 5 chances for map shuffle to occur, and 15 chances for map shuffle to be turned
#    off.
#
# Q. I've never seen a file like this before. What characters am I allowed to use?
# A. This is a .yaml file. You are allowed to use most characters.
#    To test if your yaml is valid or not, you can use this website:
#        http://www.yamllint.com/
#    You can also verify that your Archipelago options are valid at this site:
#        https://archipelago.gg/check

# Your name in-game, limited to 16 characters.
#     {player} will be replaced with the player's slot number.
#     {PLAYER} will be replaced with the player's slot number, if that slot number is greater than 1.
#     {number} will be replaced with the counter value of the name.
#     {NUMBER} will be replaced with the counter value of the name, if the counter value is greater than 1.
name: YourName    # Replace with your name. No spaces.

# Used to describe your yaml. Useful if you have multiple files.
description: American Truck Simulator Archipelago Settings

game: American Truck Simulator

requires:
  version: 0.5.0  # Minimum Archipelago version

American Truck Simulator:

  # ── Win Condition ─────────────────────────────────────────────────────────────
  # What you need to accomplish to complete your run.
  win_condition:
    # Reach the goal level AND the goal money amount (both required).
    level_and_money: 0
    # Reach the goal level only.
    level_only: 50
    # Reach the goal money amount only.
    money_only: 0
    # Reach either the goal level OR the goal money amount (whichever comes first).
    level_or_money: 0

  # ── Goal Level ────────────────────────────────────────────────────────────────
  # Driver level target. Level 35 is the maximum and unlocks all skill upgrades.
  #
  # You can define additional values between the minimum and maximum values.
  # Minimum value is 5
  # Maximum value is 35
  goal_level:
    5: 50
    10: 0
    15: 0
    20: 0
    25: 0
    30: 0
    35: 0
    random: 0
    random-low: 0
    random-high: 0
    random-range-5-35: 0

  # ── Goal Money ────────────────────────────────────────────────────────────────
  # Earnings target in thousands of dollars (100–10000).
  # 1000 = $1,000,000.  10000 = $10,000,000.
  #
  # You can define additional values between the minimum and maximum values.
  # Minimum value is 100
  # Maximum value is 10000
  goal_money:
    100: 0
    500: 0
    1000: 50
    2500: 0
    5000: 0
    10000: 0
    random: 0
    random-low: 0
    random-high: 0
    random-range-100-10000: 0

  # ── Enabled DLC States ────────────────────────────────────────────────────────
  # All DLC states you own. REMOVE any you do NOT have the DLC for.
  # California and Nevada (base game) are always active — do not add them here.
  # Arizona is FREE DLC — safe to keep for all players.
  enabled_dlc:
    - Arizona
    - New Mexico
    - Oregon
    - Washington
    - Utah
    - Idaho
    - Colorado
    - Wyoming
    - Montana
    - Texas
    - Oklahoma
    - Kansas
    - Nebraska
    - Arkansas
    - Missouri
    - Iowa
    - Louisiana

  # ── Location Checks ───────────────────────────────────────────────────────────
  # Reaching driver levels 5, 10, 15, 20, 25, and 30 each count as a check.
  level_milestone_checks:
    'false': 0
    'true': 50

  # Completing the first delivery of each cargo type counts as a check.
  cargo_delivery_checks:
    'false': 0
    'true': 50

  # Arriving in a city for the first time counts as a check.
  city_arrival_checks:
    'false': 0
    'true': 50

  # Entering a DLC state for the first time counts as a check.
  state_arrival_checks:
    'false': 0
    'true': 50

  # ── Trap Percentage ───────────────────────────────────────────────────────────
  # What percentage of filler item slots are replaced with money trap items
  # (traffic fines). When a trap is received, the fine amount is deducted from
  # your in-game money balance. The balance cannot drop below $0.
  #
  # Fine amounts: $500  $1,000  $2,500  $5,000  $10,000  $25,000  $50,000
  #
  # You can define additional values between the minimum and maximum values.
  # Minimum value is 0 (no traps)
  # Maximum value is 100 (all filler slots become traps)
  trap_percentage:
    0: 50
    10: 0
    20: 0
    25: 0
    50: 0
    random: 0
    random-low: 0
    random-high: 0
    random-range-0-100: 0

  # ── Death Link ────────────────────────────────────────────────────────────────
  # When enabled, wrecking your truck (engine damage reaching 90% — effectively
  # undriveable) sends a "death" to all Death Link players in the session.
  # When one of THEM dies, you pay an emergency towing fee: a percentage of
  # your current money (death_link_penalty below). Balance never drops below $0.
  death_link:
    'false': 50
    'true': 0

  # Percentage of your current money deducted when receiving a death (0-50).
  # Only used when death_link is enabled.
  #
  # You can define additional values between the minimum and maximum values.
  # Minimum value is 0
  # Maximum value is 50
  death_link_penalty:
    0: 0
    5: 0
    15: 50
    25: 0
    50: 0
    random: 0
    random-low: 0
    random-high: 0
    random-range-0-50: 0
