# ══════════════════════════════════════════════════════════════════════════════
#  American Truck Simulator — Archipelago Player Template
# ══════════════════════════════════════════════════════════════════════════════
#
#  Drive across the American West, delivering cargo and discovering cities.
#  Money and XP grants fill the item pool so every check rewards something useful.
#
#  Instructions:
#   1. Set your player name below.
#   2. Under "enabled_dlc", REMOVE any states you do NOT own.
#      All states are listed — keep only the ones you have the DLC for.
#      California and Nevada are always active (base game) — they are not listed.
#   3. Adjust any other options to your preference.
#   4. Submit this file to your Archipelago server.
# ══════════════════════════════════════════════════════════════════════════════

name: YourName    # Your name as it will appear in the multiworld. No spaces.

game: American Truck Simulator

requires:
  version: 0.5.0  # Minimum Archipelago version

American Truck Simulator:

  # ── Win Condition ─────────────────────────────────────────────────────────────
  # What you need to accomplish to complete your run.
  # Valid values (use the string name — most reliable across all AP versions):
  #
  #   level_and_money  Reach the goal level AND the goal money amount (both).
  #   level_only       Reach the goal level.
  #   money_only       Reach the goal money amount.
  #   level_or_money   Reach either the goal level OR the goal money (first wins).
  win_condition: level_only

  # Driver level target (5–35). Level 35 is the maximum and unlocks all skill upgrades.
  goal_level: 5

  # Earnings target in thousands of dollars (100–10000).
  # Default 1000 = $1,000,000. Maximum 10000 = $10,000,000.
  goal_money: 1000

  # ── Enabled DLC States ────────────────────────────────────────────────────────
  # All DLC states are listed below. REMOVE any states you do NOT own.
  # California and Nevada (base game) are always active — do not add them here.
  # Arizona is FREE DLC — safe to keep for all players.
  enabled_dlc:
    - Arizona
    - New Mexico
    - Oregon
    - Washington
    - Utah
    - Idaho
    - Colorado
    - Wyoming
    - Montana
    - Texas
    - Oklahoma
    - Kansas
    - Nebraska
    - Arkansas
    - Missouri
    - Iowa
    - Louisiana

  # ── Location Checks ───────────────────────────────────────────────────────────
  # Reaching driver levels 5, 10, 15, 20, 25, and 30 each count as a check.
  level_milestone_checks: true

  # Completing the first delivery of each cargo type counts as a check.
  # All cargo types are included regardless of which DLC states are enabled,
  # since ATS job markets can offer any cargo type across all owned states.
  cargo_delivery_checks: true

  # Arriving in a city for the first time counts as a check.
  # Only cities in California, Nevada, and your enabled DLC states are included.
  city_arrival_checks: true

  # Entering a DLC state for the first time counts as a check.
  # Fires when you arrive in the first city in that state. California and Nevada
  # are excluded since they are always accessible from the start.
  state_arrival_checks: true

  # ── Death Link ────────────────────────────────────────────────────────────────
  # When enabled, crashing your truck sends a "death" event to all Death Link
  # players in the session. Receiving a death from them causes a truck breakdown
  # event in your game.
  death_link: false

